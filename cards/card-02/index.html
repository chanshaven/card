<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Just for you ♡</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="hearts" id="hearts"></div>

    <main class="card" id="card">

        <div id="question-screen">

            <p class="small-text">
                Cho em hỏi câu hỏi thầm kín ...
            </p>

            <h1>
                Anh Híu có bê đê k ạ?
            </h1>

            <p class="subtitle">
                mãi keo ♡
            </p>

            <div class="button-area" id="buttonArea">

                <button class="yes-btn" id="yesBtn">
                    Yes ♡
                </button>

                <button class="no-btn" id="noBtn">
                    No
                </button>

            </div>

        </div>


        <div id="answer-screen" class="hidden">

            <p class="small-text">
                đấy thấy chưa ♡
            </p>

            <h1>
                Em biết mà, biết mà ...
            </h1>

            <div class="big-heart">
                ♡
            </div>

            <img src="images/Hiubd.jpg" alt="hehe" class="final-photo">

            <p class="final-message">
                em mãi ủng hộ anh ạ
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
